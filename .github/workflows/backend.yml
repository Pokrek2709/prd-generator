name: backend
on:
  push:
    paths: ["backend/**", "docker-compose.yml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docker-compose.yml", ".github/workflows/backend.yml"]
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prd_test
          POSTGRES_PASSWORD: prd_test
          POSTGRES_DB: prd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prd_test -d prd_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://prd_test:prd_test@localhost:5432/prd_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l $(find cmd internal -name '*.go'))"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
